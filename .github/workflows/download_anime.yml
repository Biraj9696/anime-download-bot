name: Download and Merge Anime

on:
  repository_dispatch:
    types: [download-anime]

env:
  MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
  MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}

jobs:
  download-merge-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aniworld mega.py
          # Install ffmpeg
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Download and merge
        env:
          ANIWORLD_URL: ${{ github.event.client_payload.url }}
        run: |
          python download_merge.py "$ANIWORLD_URL"
      
      - name: Upload to MEGA
        env:
          OUTPUT_PATH: ${{ steps.download-merge.outputs.output_path }}
        run: |
          python mega_upload.py "$OUTPUT_PATH" "$MEGA_EMAIL" "$MEGA_PASSWORD"
      
      - name: Send result to Discord
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const downloadLink = '${{ steps.upload-mega.outputs.download_link }}';
            // We'll need to send this back to Discord via webhook
            console.log('Download link:', downloadLink)
